name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci || (tail -n 50 ~/.npm/_logs/*.log >> $GITHUB_STEP_SUMMARY && exit 1)

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run knip
      - run: npm run coverage
      - run: npm run build
      - run: npm run check:repo
      - run: npm audit --audit-level=high
